// ============ УТИЛИТЫ ============
function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

function formatTime(iso) {
    try {
        const d = new Date(iso);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${dd}.${mm} ${hh}:${mi}`;
    } catch (e) { return iso; }
}

function showStatus(text, ms = 3000, isError = false) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.classList.toggle('err', isError);
    el.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => el.classList.remove('show'), ms);
}

// ============ ПАРСЕР СООБЩЕНИЙ ============
function extractDroneId(text) {
    if (!text) return null;
    const m = text.match(/\b(герань|шахед|shahed|geran|гербера)[\s\-–—]*(\d{1,4})\b/i);
    if (m) {
        const name = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
        return `${name}-${m[2]}`;
    }
    const t = text.match(/\b(герань|шахед|shahed|geran|гербера)\b/i);
    if (t) {
        const name = t[1].charAt(0).toUpperCase() + t[1].slice(1).toLowerCase();
        return `${name}-?`;
    }
    return null;
}

// Транслитерация кириллицы → латиница для нечёткого поиска
function normalize(s) {
    return s
        .toLowerCase()
        .replace(/[ʼ'`’]/g, '')
        .replace(/ї/g, 'i')
        .replace(/і/g, 'i')
        .replace(/є/g, 'e')
        .replace(/ґ/g, 'g')
        .replace(/ё/g, 'е')
        .replace(/ы/g, 'и')
        .replace(/ъ|ь/g, '');
}

function extractKnownPlaces(text) {
    const lower = text.toLowerCase();
    const normalized = normalize(text);
    const found = [];
    const seen = new Set();

    for (const [key, coords] of Object.entries(KYIV_LOCATIONS)) {
        const normKey = normalize(key);
        // Ищем по границам слов (с учётом нормализации)
        const re = new RegExp(`(^|[\\s/,.|(«"'])?${escapeRegex(key)}([\\s/,.|)»"'?!]|$)`, 'i');
        const reNorm = new RegExp(`(^|[\\s/,.|(«"'])?${escapeRegex(normKey)}([\\s/,.|)»"'?!]|$)`, 'i');

        if ((re.test(lower) || reNorm.test(normalized)) && !seen.has(coords.label)) {
            seen.add(coords.label);
            // Индекс первого вхождения ключа (для сортировки по порядку в тексте)
            let idx = lower.indexOf(key);
            if (idx === -1) idx = normalized.indexOf(normKey);
            found.push({ ...coords, index: idx });
        }
    }
    found.sort((a, b) => a.index - b.index);
    return found;
}

function extractUnknownCandidates(text, knownPlaces) {
    const knownLabels = new Set(knownPlaces.map(p => p.label.toLowerCase()));
    const candidates = [];
    // Слова с большой буквы (кириллица/латиница), длина 5+
    const words = text.match(/\b[А-ЯІЇЄҐA-Z][а-яіїєґa-z]{4,}\b/g) || [];
    for (const w of words) {
        const lower = w.toLowerCase();
        // Исключаем типичные слова-шум
        if (['київ','киев','києва','увага','отбой','відбій','тревога','загроза',
             'ракета','ракети','дрони','дроны','шахед','герань','бпла','повітря',
             'повітряна','повітряна','тривога','пуски','пуск','запуск','курс','курсом',
             'прямує','летить','рухається','відмітка','попередньо'].includes(lower)) continue;
        if (!knownLabels.has(lower) && !candidates.includes(w)) {
            candidates.push(w);
        }
    }
    return candidates.slice(0, 4);
}

function parseMessage(text) {
    if (!text) return null;

    // Убираем жёсткий фильтр по «Герань/БПЛА» — реагируем на любые места из словаря
    const knownPlaces = extractKnownPlaces(text);
    if (knownPlaces.length === 0) return null;

    // Пытаемся выделить ID дрона, но если нет — «Ціль-N»
    const droneId = extractDroneId(text) || 'Ціль-?';
    const needsGeocode = extractUnknownCandidates(text, knownPlaces);

    return { droneId, route: knownPlaces, needsGeocode, sourceText: text };
}

// ============ ЗАГРУЗКА HTML С t.me ЧЕРЕЗ CORS-ПРОКСИ ============
async function fetchChannelHtml(channel) {
    const target = `https://t.me/s/${channel}`;
    let lastErr = null;

    for (let i = 0; i < CORS_PROXIES.length; i++) {
        const buildUrl = CORS_PROXIES[i];
        try {
            const url = buildUrl(target);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            const r = await fetch(url, { signal: controller.signal });
            clearTimeout(timeout);

            if (!r.ok) throw new Error('HTTP ' + r.status);
            const text = await r.text();
            if (!text || text.length < 500) throw new Error('Пустой ответ');
            // Проверяем, что это действительно HTML канала
            if (!text.includes('tgme_widget_message')) {
                throw new Error('Не похоже на страницу канала');
            }
            if (i > 0) console.log(`Прокси #${i + 1} сработал`);
            return text;
        } catch (e) {
            lastErr = e;
            console.warn(`Прокси #${i + 1} не сработал:`, e.message);
        }
    }
    throw new Error('Все CORS-прокси недоступны: ' + (lastErr ? lastErr.message : '?'));
}

function parseChannelMessages(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const posts = doc.querySelectorAll('.tgme_widget_message_wrap');
    const messages = [];
    posts.forEach((post, i) => {
        if (i < posts.length - MESSAGES_TO_SCAN) return;
        const textEl = post.querySelector('.tgme_widget_message_text');
        const timeEl = post.querySelector('.tgme_widget_message_date time');
        const text = textEl ? textEl.innerText.trim() : '';
        const time = timeEl ? timeEl.getAttribute('datetime') : null;
        if (text) messages.push({ text, time });
    });
    return messages;
}

// ============ ГЕОКОДИНГ ============
let geocodeCache = {};
let lastNominatimCall = 0;

function loadCache() {
    try {
        const raw = localStorage.getItem('geocode_cache');
        if (raw) geocodeCache = JSON.parse(raw);
    } catch (e) { console.warn('cache load', e); }
}
function saveCache() {
    try { localStorage.setItem('geocode_cache', JSON.stringify(geocodeCache)); }
    catch (e) { console.warn('cache save', e); }
}

async function geocodePlace(placeName) {
    const key = placeName.toLowerCase();
    if (geocodeCache[key] !== undefined) return geocodeCache[key];

    const now = Date.now();
    const wait = NOMINATIM_MIN_INTERVAL - (now - lastNominatimCall);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    lastNominatimCall = Date.now();

    try {
        const url = 'https://nominatim.openstreetmap.org/search?' +
            new URLSearchParams({
                q: `${placeName}, Київська область, Україна`,
                format: 'json',
                limit: '1',
            });
        const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
        const data = await r.json();
        if (data && data.length > 0) {
            const result = {
                lat: parseFloat(data[0].lat),
                lng: parseFloat(data[0].lon),
                label: placeName,
            };
            geocodeCache[key] = result;
            saveCache();
            console.log('🌍 Nominatim:', placeName, '→', result.lat, result.lng);
            return result;
        }
    } catch (e) {
        console.warn('Nominatim error:', e);
    }
    geocodeCache[key] = null;
    saveCache();
    return null;
}

// ============ СОСТОЯНИЕ ============
let state = { drones: {}, lastPoll: null, lastError: null };
let history = {};

function loadState() {
    try {
        const raw = localStorage.getItem('drone_state');
        if (raw) state = JSON.parse(raw);
        if (!state.drones) state = { drones: {}, lastPoll: null, lastError: null };
    } catch (e) { state = { drones: {}, lastPoll: null, lastError: null }; }
}
function saveState() {
    try { localStorage.setItem('drone_state', JSON.stringify(state)); }
    catch (e) { console.warn('state save', e); }
}

function loadHistory() {
    try {
        const raw = localStorage.getItem('drone_history');
        if (raw) history = JSON.parse(raw);
    } catch (e) { history = {}; }
}
function saveHistory() {
    try { localStorage.setItem('drone_history', JSON.stringify(history)); }
    catch (e) { console.warn('history save', e); }
}

function appendHistory(droneId, entry) {
    if (!history[droneId]) history[droneId] = [];
    const last = history[droneId][history[droneId].length - 1];
    if (last && last.timestamp === entry.timestamp && last.route.length === entry.route.length) return;
    history[droneId].push(entry);
    if (history[droneId].length > HISTORY_LIMIT) {
        history[droneId] = history[droneId].slice(-HISTORY_LIMIT);
    }
    saveHistory();
}

function pruneOldDrones() {
    const now = Date.now();
    let changed = false;
    for (const [id, d] of Object.entries(state.drones)) {
        const age = now - new Date(d.timestamp).getTime();
        if (age > RESET_AFTER_MS) {
            delete state.drones[id];
            changed = true;
        }
    }
    if (changed) saveState();
}

// ============ ОСНОВНОЙ ЦИКЛ ОПРОСА ============
let isPolling = false;

async function pollAllChannels() {
    if (isPolling) return;
    isPolling = true;

    let fetchedAny = false;
    let lastErr = null;

    try {
        for (const channel of CHANNELS) {
            let messages;
            try {
                const html = await fetchChannelHtml(channel);
                messages = parseChannelMessages(html);
                fetchedAny = true;
                console.log(`[${channel}] загружено ${messages.length} сообщений`);
            } catch (e) {
                lastErr = e.message;
                console.error('Ошибка загрузки ' + channel + ':', e);
                continue;
            }

            let foundInChannel = 0;

            for (let i = messages.length - 1; i >= 0; i--) {
                const msg = messages[i];
                const parsed = parseMessage(msg.text);
                if (!parsed) continue;

                let route = parsed.route;

                if (parsed.needsGeocode.length > 0) {
                    for (const cand of parsed.needsGeocode) {
                        const geo = await geocodePlace(cand);
                        if (geo) route.push(geo);
                    }
                }
                if (route.length === 0) continue;

                const id = parsed.droneId;
                const timestamp = msg.time || new Date().toISOString();

                const existing = state.drones[id];
                if (existing && existing.timestamp === timestamp) continue;

                state.drones[id] = {
                    id, route, timestamp,
                    sourceText: parsed.sourceText,
                    channel,
                };
                appendHistory(id, {
                    timestamp,
                    route,
                    sourceText: parsed.sourceText,
                    channel,
                });
                foundInChannel++;
            }

            if (foundInChannel > 0) {
                saveState();
                console.log(`[${channel}] найдено маршрутов: ${foundInChannel}`);
            }
        }

        if (fetchedAny) {
            state.lastPoll = new Date().toISOString();
            state.lastError = null;
            saveState();
        } else {
            state.lastError = lastErr;
            saveState();
        }

        pruneOldDrones();
        renderAll();
        updateMeta();
    } catch (e) {
        console.error('pollAllChannels:', e);
        state.lastError = e.message;
        saveState();
    } finally {
        isPolling = false;
    }
}

function updateMeta() {
    const meta = document.getElementById('panelMeta');
    if (state.lastError) {
        meta.textContent = '⚠️ ' + state.lastError;
        meta.style.color = '#ff8888';
        return;
    }
    if (state.lastPoll) {
        const t = new Date(state.lastPoll);
        const hh = String(t.getHours()).padStart(2, '0');
        const mi = String(t.getMinutes()).padStart(2, '0');
        const ss = String(t.getSeconds()).padStart(2, '0');
        meta.textContent = `Обновлено: ${hh}:${mi}:${ss}`;
        meta.style.color = '#aaa';
    } else {
        meta.textContent = 'Ещё не обновлялось';
        meta.style.color = '#aaa';
    }
}

// ============ КАРТА ============
const map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
}).setView([50.4501, 30.5234], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

const COLORS = ['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0c7','#007aff','#5856d6','#af52de','#ff2d55'];
const colorMap = {};
function colorFor(id) {
    if (!colorMap[id]) colorMap[id] = COLORS[Object.keys(colorMap).length % COLORS.length];
    return colorMap[id];
}

const activeDrones = {};

function makeIcon(id) {
    const color = colorFor(id);
    return L.divIcon({
        className: 'drone-icon',
        html:
            '<div style="font-size:26px;filter:drop-shadow(0 0 6px ' + color + ')">✈️</div>' +
            '<div style="font-size:10px;color:' + color + ';font-weight:700;text-align:center;white-space:nowrap">' +
                escapeHtml(id) +
            '</div>',
        iconSize: [44, 44],
        iconAnchor: [22, 22]
    });
}

function openHistoryPopup(id, latlng) {
    const items = (history[id] || []).slice().reverse();
    let html = '<div class="history-popup">';
    html += '<div style="font-weight:700;margin-bottom:6px">📜 ' + escapeHtml(id) + '</div>';
    if (items.length === 0) {
        html += '<div class="empty">История пуста</div>';
    } else {
        for (const h of items) {
            const route = (h.route || []).map(p => escapeHtml(p.label)).join(' → ');
            let src = '';
            if (h.sourceText) {
                const t = h.sourceText.length > 140 ? h.sourceText.slice(0, 140) + '…' : h.sourceText;
                src = escapeHtml(t);
            }
            html += '<div class="entry">';
            html += '<div class="time">' + formatTime(h.timestamp) + '</div>';
            html += '<div class="route">' + route + '</div>';
            if (src) html += '<div class="src">«' + src + '»</div>';
            html += '</div>';
        }
    }
    html += '</div>';

    L.popup({ maxWidth: 320, minWidth: 260, autoPan: true })
        .setLatLng(latlng)
        .setContent(html)
        .openOn(map);
}

function renderDrone(drone) {
    const existing = activeDrones[drone.id];
    if (existing && existing.lastTimestamp === drone.timestamp) return;

    if (existing) {
        if (existing.marker) map.removeLayer(existing.marker);
        if (existing.polyline) map.removeLayer(existing.polyline);
    }

    const points = drone.route;
    if (!points || points.length === 0) return;

    const color = colorFor(drone.id);
    const icon = makeIcon(drone.id);

    if (points.length === 1) {
        const m = L.marker([points[0].lat, points[0].lng], { icon }).addTo(map);
        m.on('click', () => openHistoryPopup(drone.id, m.getLatLng()));
        activeDrones[drone.id] = { marker: m, polyline: null, lastTimestamp: drone.timestamp };
        return;
    }

    const latlngs = points.map(p => [p.lat, p.lng]);
    const polyline = L.polyline(latlngs, {
        color, weight: 3, dashArray: '6,10', opacity: 0.85
    }).addTo(map);

    const marker = L.markerMotion(latlngs, 80, {
        icon, rotation: true, autoplay: true, loop: false
    }).addTo(map);

    marker.on('click', () => openHistoryPopup(drone.id, marker.getLatLng()));

    activeDrones[drone.id] = { marker, polyline, lastTimestamp: drone.timestamp };

    if (Object.keys(activeDrones).length === 1) {
        try { map.fitBounds(polyline.getBounds(), { padding: [60, 60] }); } catch (e) {}
    }
}

function removeStaleDrones(currentIds) {
    for (const id of Object.keys(activeDrones)) {
        if (!currentIds.includes(id)) {
            const d = activeDrones[id];
            if (d.marker) map.removeLayer(d.marker);
            if (d.polyline) map.removeLayer(d.polyline);
            delete activeDrones[id];
        }
    }
}

function updatePanel(drones) {
    const title = document.getElementById('panelTitle');
    const list = document.getElementById('droneList');

    if (drones.length === 0) {
        title.textContent = '📡 Нет активных целей';
        list.innerHTML = '';
        return;
    }
    title.textContent = '📡 Активные цели: ' + drones.length;

    let html = '';
    for (const d of drones) {
        const color = colorFor(d.id);
        const routeStr = (d.route || []).map(p => escapeHtml(p.label)).join(' → ');
        html +=
            '<div class="drone-row">' +
                '<span class="dot" style="background:' + color + '"></span>' +
                '<div class="drone-text">' +
                    '<div class="drone-id" style="color:' + color + '">' + escapeHtml(d.id) + '</div>' +
                    '<div class="drone-route">' + routeStr + '</div>' +
                '</div>' +
            '</div>';
    }
    list.innerHTML = html;
}

function renderAll() {
    const drones = Object.values(state.drones);
    removeStaleDrones(drones.map(d => d.id));
    for (const d of drones) renderDrone(d);
    updatePanel(drones);
}

// ============ UI ============
const panel = document.getElementById('panel');
const toggleBtn = document.getElementById('toggleBtn');
toggleBtn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    toggleBtn.textContent = panel.classList.contains('collapsed') ? 'Развернуть' : 'Свернуть';
});

// ============ СТАРТ ============
loadCache();
loadState();
loadHistory();
renderAll();
updateMeta();

pollAllChannels();
setInterval(pollAllChannels, POLL_INTERVAL_MS);
setInterval(() => {
    pruneOldDrones();
    renderAll();
    updateMeta();
}, 60_000);

showStatus('Загрузка данных...');
</script>
